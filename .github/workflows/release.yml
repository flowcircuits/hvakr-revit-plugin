name: Release

# Builds, signs, and verifies the bundle, then creates a DRAFT GitHub release.
# Nothing here touches GCS or creates a tag. Publishing the draft (a human click)
# creates the tag and triggers publish-to-gcs.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict major.minor.patch version, without a v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Draft v${{ inputs.version }}
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    environment: production
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release
      id-token: write # Azure OIDC for Artifact Signing
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and refuse existing tag or release
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Version must be strict major.minor.patch."
          }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:TAG already exists." }
          # Includes drafts, which have no tag yet.
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases." }
          if ($releases.tagName -contains $env:TAG) { throw "A release for $env:TAG already exists, possibly as a draft." }
          $global:LASTEXITCODE = 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build, test, and stage bundle
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version $env:VERSION -Step Prepare

      - name: List HVAKR assemblies to sign
        id: sign-list
        shell: pwsh
        run: |
          $files = Get-ChildItem HVAKR.Revit/Deploy/Bundle -Recurse -Filter HVAKR*.dll | ForEach-Object FullName
          if (!$files) { throw "No HVAKR assemblies were staged." }
          "files=$($files -join ',')" >> $env:GITHUB_OUTPUT

      - name: Azure login with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign HVAKR assemblies
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ steps.sign-list.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Zip and verify signatures, versions, and layout
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version $env:VERSION -Step Package -RequireSignature

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $zip = "HVAKR.Revit/Deploy/HVAKR-Revit-Plugin-$env:VERSION.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @"
          **Draft. Not published anywhere.** Publishing this release creates tag ``$env:TAG`` and copies the zip to ``gs://hvakr-desktop-releases/revit/``.

          - Built from ``$env:GITHUB_SHA`` by [run $env:GITHUB_RUN_ID]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)
          - ``HVAKR-Revit-Plugin-$env:VERSION.zip`` SHA256: ``$hash``
          - HVAKR DLLs are signed by Flow Circuits. The zip itself is not signed.

          Install: unzip ``HVAKR.bundle`` into ``%AppData%\Autodesk\ApplicationPlugins`` and restart Revit.
          "@
          gh release create $env:TAG $zip "$zip.sha256" --draft --target $env:GITHUB_SHA --title "HVAKR Revit Plugin $env:VERSION" --notes $notes --generate-notes
          "Draft created for $env:TAG with SHA256 $hash" >> $env:GITHUB_STEP_SUMMARY
