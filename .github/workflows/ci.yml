name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and Test
    # Keep in sync with release.yml so CI proves the release runner image.
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HVAKR.Revit.sln

      - name: Build
        run: dotnet build HVAKR.Revit.sln --configuration Debug --no-restore

      - name: Test
        run: dotnet test HVAKR.Api.Tests/HVAKR.Api.Tests.csproj --configuration Debug --no-build --verbosity normal

      # Same script and steps as release.yml, without Azure login, signing, or the draft release.
      - name: Release path (unsigned bundle)
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -Version 0.1.0 -Step Prepare
          ./scripts/Build-Release.ps1 -Version 0.1.0 -Step Package

      - name: Upload unsigned test bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-test-bundle
          path: |
            HVAKR.Revit/Deploy/HVAKR-Revit-Plugin-0.1.0.zip
            HVAKR.Revit/Deploy/HVAKR-Revit-Plugin-0.1.0.zip.sha256
          if-no-files-found: error
          retention-days: 7

  revit-api:
    # HVAKR.Revit compiles against 2026 and HVAKR.Revit.UI against 2025, but the same DLLs load in
    # both. Compiling everything against each API catches a call that is missing from either version.
    name: Compile against Revit ${{ matrix.revit }} API
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - revit: "2025"
            api: 2025.4.20
          - revit: "2026"
            api: 2026.4.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-revit${{ matrix.revit }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-revit${{ matrix.revit }}-

      - name: Build
        run: dotnet build HVAKR.Revit/HVAKR.Revit.csproj --configuration Release /p:Revit2025ApiVersion=${{ matrix.api }} /p:Revit2026ApiVersion=${{ matrix.api }}

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          curl -sSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
