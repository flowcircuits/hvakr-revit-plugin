name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and Test
    # Keep in sync with release.yml so CI proves the release runner image.
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HVAKR.Revit.sln

      - name: Build
        run: dotnet build HVAKR.Revit.sln --configuration Debug --no-restore

      - name: Test
        run: dotnet test HVAKR.Api.Tests/HVAKR.Api.Tests.csproj --configuration Debug --no-build --verbosity normal

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --no-progress --yes
          $installed = choco list innosetup --exact --limit-output
          if ($installed -ne "innosetup|6.7.1") { throw "Expected Inno Setup 6.7.1, found $installed." }

      # Same script and steps as release.yml, without Azure login, signing, or publishing.
      - name: Release path for 0.1.0
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -Version 0.1.0 -Step Prepare
          ./scripts/Build-Release.ps1 -Version 0.1.0 -Step Package
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item HVAKR.Revit/Deploy/Installer/HVAKR-Revit-Plugin-0.1.0.exe artifacts/HVAKR-Revit-Plugin-0.1.0.exe

      - name: Release path for 0.1.1 upgrade
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -Version 0.1.1 -Step Prepare
          ./scripts/Build-Release.ps1 -Version 0.1.1 -Step Package

      - name: Smoke-test per-user install, upgrade, and uninstall
        shell: pwsh
        run: ./scripts/Test-Installer.ps1 -FirstInstaller artifacts/HVAKR-Revit-Plugin-0.1.0.exe -UpgradeInstaller HVAKR.Revit/Deploy/Installer/HVAKR-Revit-Plugin-0.1.1.exe

      - name: Smoke-test all-users installer migration
        shell: pwsh
        run: ./scripts/Test-Installer.ps1 -FirstInstaller artifacts/HVAKR-Revit-Plugin-0.1.0.exe -UpgradeInstaller HVAKR.Revit/Deploy/Installer/HVAKR-Revit-Plugin-0.1.1.exe -AllUsers

  revit-api:
    # HVAKR.Revit compiles against 2026 and HVAKR.Revit.UI against 2025, but the same DLLs load in
    # both. Compiling everything against each API catches a call that is missing from either version.
    name: Compile against Revit ${{ matrix.revit }} API
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - revit: "2025"
            api: 2025.4.20
          - revit: "2026"
            api: 2026.4.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-revit${{ matrix.revit }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-revit${{ matrix.revit }}-

      - name: Build
        run: dotnet build HVAKR.Revit/HVAKR.Revit.csproj --configuration Release /p:Revit2025ApiVersion=${{ matrix.api }} /p:Revit2026ApiVersion=${{ matrix.api }}

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          curl -sSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
